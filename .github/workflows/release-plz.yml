name: Release-plz

on:
  push:
    branches: [main]

concurrency:
  group: release-plz
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release-plz-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1
        with:
          app-id: ${{ secrets.RELEASE_PLZ_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLZ_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Use the App token so release-plz's git push (tags, etc.)
          # is authored by the App rather than the default GITHUB_TOKEN.
          token: ${{ steps.app-token.outputs.token }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Release
        uses: release-plz/action@v0.5
        with:
          command: release
        env:
          # App token so the `release: published` event fires downstream
          # workflows (e.g. release-binaries.yml). Events created by the
          # default GITHUB_TOKEN do not trigger other workflow runs.
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

  release-plz-pr:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1
        with:
          app-id: ${{ secrets.RELEASE_PLZ_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLZ_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Release PR
        uses: release-plz/action@v0.5
        with:
          command: release-pr
        env:
          # Same App token as the release job — also lets CI run on the
          # release-plz PR (PRs opened with the default GITHUB_TOKEN
          # do not trigger workflow runs).
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
