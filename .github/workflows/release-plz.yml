name: Release-plz

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-plz-release:
    runs-on: ubuntu-latest
    concurrency:
      group: release-plz-release
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v3.1.1
        with:
          app-id: ${{ secrets.RELEASE_PLZ_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLZ_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          # Use the App token so release-plz's git push (tags, etc.)
          # is authored by the App rather than the default GITHUB_TOKEN.
          token: ${{ steps.app-token.outputs.token }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Release
        uses: release-plz/action@v0.5
        with:
          command: release
        env:
          # App token so the `release: published` event fires downstream
          # workflows (e.g. release-binaries.yml). Events created by the
          # default GITHUB_TOKEN do not trigger other workflow runs.
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          # crates.io API token — release-plz invokes `cargo publish`,
          # which reads this env var. Without it the publish step fails
          # with "no token found, please run `cargo login`".
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  release-plz-pr:
    runs-on: ubuntu-latest
    concurrency:
      group: release-plz-pr
      cancel-in-progress: true
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v3.1.1
        with:
          app-id: ${{ secrets.RELEASE_PLZ_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLZ_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          token: ${{ steps.app-token.outputs.token }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Release PR
        id: release-pr
        uses: release-plz/action@v0.5
        with:
          command: release-pr
        env:
          # Same App token as the release job — also lets CI run on the
          # release-plz PR (PRs opened with the default GITHUB_TOKEN
          # do not trigger workflow runs).
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Rebase release PR branch
        if: steps.release-pr.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR: ${{ steps.release-pr.outputs.pr }}
        run: |
          set -euo pipefail

          pr_number=$(jq -r '.number // empty' <<<"$PR")
          if [[ -z "$pr_number" ]]; then
            echo "release-plz reported a PR but did not return a PR number" >&2
            exit 1
          fi

          gh pr update-branch "$pr_number" --rebase
