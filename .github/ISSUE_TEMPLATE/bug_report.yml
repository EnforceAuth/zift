name: Bug report
description: Something Zift is doing wrong, or not doing at all
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report. Please fill out as
        much of the form as you can — the more detail, the faster we can fix.

        **Security vulnerability?** Don't file a public issue. See
        [SECURITY.md](../blob/main/SECURITY.md) for the private channel.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear, concise description of the bug.
      placeholder: When I run `zift scan ./src`, ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: A minimal repro is the most valuable thing you can give us.
      placeholder: |
        1. Clone https://github.com/...
        2. Run `zift scan .`
        3. Observe ...
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Zift version
      description: Output of `zift --version`.
      placeholder: zift 0.1.4
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Linux
        - Windows
        - Other (note in description)
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / output
      description: Paste relevant log output. `RUST_LOG=debug` is helpful.
      render: shell

  - type: checkboxes
    id: terms
    attributes:
      label: Code of Conduct
      options:
        - label: I agree to follow this project's [Code of Conduct](../blob/main/CODE_OF_CONDUCT.md).
          required: true
