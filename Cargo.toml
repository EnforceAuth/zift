[package]
name = "zift"
version = "0.2.0"
edition = "2024"
rust-version = "1.91"
description = "Scan codebases for embedded authorization logic and generate Policy as Code (Rego/OPA today)"
license = "Apache-2.0"
repository = "https://github.com/EnforceAuth/zift"
homepage = "https://github.com/EnforceAuth/zift"
documentation = "https://docs.rs/zift"
readme = "README.md"
keywords = ["authorization", "policy-as-code", "opa", "rego", "static-analysis"]
categories = ["command-line-utilities", "development-tools"]

[features]
# Exposes internal implementation modules (config, deep, mcp, output, scanner)
# as public API. No semver stability guarantee; opt in explicitly.
unstable = []

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "1.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tree-sitter = "0.26"
tree-sitter-typescript = "0.23"
tree-sitter-java = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-python = "0.25"
tree-sitter-go = "0.25"
tree-sitter-c-sharp = "0.23"
ignore = "0.4"
sha2 = "0.11"
regex = "1"
streaming-iterator = "0.1"
regorus = { version = "0.9", default-features = false, features = ["arc"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
url = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
mockito = "1"

# Integration tests in `tests/` reach into modules gated behind `unstable`
# (deep, mcp, scanner, config). Mark them as requiring the feature so
# default `cargo test` skips them cleanly; CI runs `cargo test --all-features`
# to exercise them.
[[test]]
name = "deep_http_integration"
required-features = ["unstable"]

[[test]]
name = "deep_subprocess_integration"
required-features = ["unstable"]

[[test]]
name = "mcp_stdio_integration"
required-features = ["unstable"]

[[test]]
name = "scanner_enforcement_points"
required-features = ["unstable"]

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/zift-{ target }{ archive-suffix }"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"
