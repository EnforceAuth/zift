[package]
name = "zift"
version = "0.1.6"
edition = "2024"
rust-version = "1.91"
description = "Scan codebases for embedded authorization logic and generate Policy as Code (Rego/OPA today)"
license = "Apache-2.0"
repository = "https://github.com/EnforceAuth/zift"
homepage = "https://github.com/EnforceAuth/zift"
documentation = "https://docs.rs/zift"
readme = "README.md"
keywords = ["authorization", "policy-as-code", "opa", "rego", "static-analysis"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tree-sitter = "0.24"
tree-sitter-typescript = "0.23"
tree-sitter-java = "0.23"
tree-sitter-javascript = "0.23"
tree-sitter-python = "0.23"
tree-sitter-go = "0.23"
ignore = "0.4"
sha2 = "0.10"
regex = "1"
streaming-iterator = "0.1"
regorus = { version = "0.9", default-features = false, features = ["arc"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
url = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
mockito = "1"

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/zift-{ target }{ archive-suffix }"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"
