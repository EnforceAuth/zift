[package]
name = "zift"
version = "0.1.2"
edition = "2024"
description = "Scan codebases for embedded authorization logic and generate Rego policies for OPA"
license = "Apache-2.0"
repository = "https://github.com/EnforceAuth/zift"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tree-sitter = "0.24"
tree-sitter-typescript = "0.23"
tree-sitter-java = "0.23"
tree-sitter-javascript = "0.23"
ignore = "0.4"
sha2 = "0.10"
regex = "1"
streaming-iterator = "0.1"
regorus = { version = "0.9", default-features = false, features = ["arc"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }

[dev-dependencies]
tempfile = "3"
mockito = "1"

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/zift-{ target }{ archive-suffix }"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"
