[rule]
id = "go-has-role-call"
languages = ["go"]
category = "rbac"
confidence = "high"
description = "Bare or method-style role-checking call (e.g. HasRole(\"admin\"), authz.IsInRole(\"manager\"))"
# Matches both `HasRole("admin")` (bare identifier function) and
# `authz.HasRole("admin")` (method call via selector_expression). Go uses
# `call_expression` for both — the alternation in `function:` captures
# either shape into the same `fn_name` capture.
#
# The argument is constrained to a string literal (interpreted or raw —
# Go supports both `"foo"` and `\`foo\``). Identifier or qualified-name
# args (e.g. `HasRole(roles.Admin)`) intentionally don't match: the rego
# template substitutes `{{role_value}}` with the captured text, so
# non-literal args would emit nonsense stubs. Mirrors the Python rule.
query = """
(call_expression
  function: [
    (identifier) @fn_name
    (selector_expression field: (field_identifier) @fn_name)
  ]
  arguments: (argument_list
    [
      (interpreted_string_literal (interpreted_string_literal_content) @role_value)
      (raw_string_literal (raw_string_literal_content) @role_value)
    ])
) @match
"""

[rule.predicates.fn_name]
match = "^(HasRole|HasAnyRole|CheckRole|IsRole|IsInRole|RequireRole|RequireRoles)$"

[rule.rego_template]
template = """
default allow := false

allow if {
    input.user.role in {"{{role_value}}"}
}
"""


[rule.cedar_template]
template = """
permit (
    principal,
    action,
    resource
)
when {
    principal.role == "{{role_value}}"
};
"""
[[rule.tests]]
input = """
package main

func handle() {
    if HasRole("admin") {
        deleteUser()
    }
}
"""
expect_match = true

[[rule.tests]]
input = """
package main

func handle(authz *Authz) {
    if authz.IsInRole("manager") {
        approve()
    }
}
"""
expect_match = true

[[rule.tests]]
input = """
package main

func handle() {
    RequireRole("ops")
}
"""
expect_match = true

# Raw string literals (backticks) are valid Go; the query accepts both
# interpreted and raw forms.
[[rule.tests]]
input = """
package main

func handle() {
    if HasRole(`admin`) {
        deleteUser()
    }
}
"""
expect_match = true

[[rule.tests]]
input = """
package main

func handle() {
    if HasFeature("beta") {
        enable()
    }
}
"""
expect_match = false

[[rule.tests]]
input = """
package main

func handle(s string) {
    if HasRole(s) {
        run()
    }
}
"""
expect_match = false
