[rule]
id = "go-ownership-check"
languages = ["go"]
category = "ownership"
confidence = "medium"
description = "Resource ownership comparison (e.g. resource.OwnerID == user.ID)"
# Catches `<expr>.<owner-style-field> == <expr>.<id-style-field>`.
# Confidence is `medium` — Go's PascalCase field names give us a fair
# signal, but unrelated identity-shaped comparisons (e.g.
# `record.ID == indexRecord.ID` for dedup) can still slip through.
# The `cross_predicate` requires that *at least one* side names a
# principal-flavored field, mirroring the Java rule's defense against
# dedup-style false positives (issue #19).
query = """
(binary_expression
  left: (selector_expression field: (field_identifier) @left_prop)
  operator: "=="
  right: (selector_expression field: (field_identifier) @right_prop)
) @match
"""

# Both per-capture predicates use the same union of owner-flavored,
# principal-flavored, and generic ID identifiers so that reversed
# operand orders (e.g. `user.ID == resource.OwnerID` or
# `ctx.Sub == record.ID`) match too. The `cross_predicate` below then
# enforces that at least one side names an auth-relevant field, which
# keeps plain `ID == ID` (dedup) and unrelated comparisons from tripping
# the rule.
[rule.predicates.left_prop]
match = "^(OwnerID|OwnerId|UserID|UserId|CreatedBy|AuthorID|AuthorId|Owner|AccountID|AccountId|ID|Id|Sub)$"

[rule.predicates.right_prop]
match = "^(OwnerID|OwnerId|UserID|UserId|CreatedBy|AuthorID|AuthorId|Owner|AccountID|AccountId|ID|Id|Sub)$"

# `Sub` is the JWT subject claim — a principal-flavored identifier even
# though it doesn't carry an `Owner`/`User` prefix. Without it here, a
# comparison like `record.ID == ctx.Sub` (resource ID vs principal
# subject) would fail the cross-predicate even though both sides pass
# the per-capture predicates.
[[rule.cross_predicates]]
kind = "any_match"
captures = ["left_prop", "right_prop"]
match = "^(OwnerID|OwnerId|UserID|UserId|CreatedBy|AuthorID|AuthorId|Owner|AccountID|AccountId|Sub)$"

[rule.rego_template]
template = """
default allow := false

allow if {
    input.resource.owner == input.user.id
}
"""


[rule.cedar_template]
template = """
permit (
    principal,
    action,
    resource
)
when {
    resource.owner == principal
};
"""
[[rule.tests]]
input = """
package main

func handle(resource *Resource, user *User) {
    if resource.OwnerID == user.ID {
        allowEdit()
    }
}
"""
expect_match = true

[[rule.tests]]
input = """
package main

func handle(post *Post, req *Request) {
    if post.AuthorID == req.UserID {
        edit()
    }
}
"""
expect_match = true

# Resource ID vs JWT subject — `Sub` qualifies as principal-flavored, so
# the cross-predicate accepts this even though the left side is a bare
# `ID`. (Without `Sub` in the cross regex, the rule used to miss this.)
[[rule.tests]]
input = """
package main

func handle(record *Record, ctx *Context) {
    if record.ID == ctx.Sub {
        allowEdit()
    }
}
"""
expect_match = true

# Reversed operand order: principal-flavored field on the left, owner-flavored
# field on the right. The unified per-capture predicates plus the auth-relevant
# cross_predicate let this match symmetrically with the canonical ordering.
[[rule.tests]]
input = """
package main

func handle(resource *Resource, user *User) {
    if user.ID == resource.OwnerID {
        allowEdit()
    }
}
"""
expect_match = true

# Reversed operand order with JWT subject on the left and bare `ID` on the
# right. Same shape as the `record.ID == ctx.Sub` case above, just flipped.
[[rule.tests]]
input = """
package main

func handle(record *Record, ctx *Context) {
    if ctx.Sub == record.ID {
        allowEdit()
    }
}
"""
expect_match = true

# FP defense (mirrors Java rule's issue #19): plain ID-vs-ID comparisons
# in dedup/audit code shouldn't trip the rule. Both sides are bare `ID`,
# no principal-flavored field on either side.
[[rule.tests]]
input = """
package main

func handle(record, indexRecord *Record) {
    if record.ID == indexRecord.ID {
        skip()
    }
}
"""
expect_match = false

[[rule.tests]]
input = """
package main

func handle(a, b *Score) {
    if a.Score == b.Score {
        tie()
    }
}
"""
expect_match = false
