[rule]
id = "go-role-check-conditional"
languages = ["go"]
category = "rbac"
confidence = "high"
description = "Direct role comparison in a conditional (e.g. user.Role == \"admin\")"
# Captures `<expr>.<role-field> == "value"`. Only `==` is matched, not
# `!=` — the rego template below is allow-style and would be inverted
# for `!=`. Tree-sitter-go exposes the operator under a named field, so
# `operator: "=="` filters precisely.
query = """
(binary_expression
  left: (selector_expression field: (field_identifier) @prop)
  operator: "=="
  right: (interpreted_string_literal (interpreted_string_literal_content) @role_value)
) @match
"""

[rule.predicates.prop]
match = "^(Role|Roles|UserRole|UserType|AccountType)$"

[rule.rego_template]
template = """
default allow := false

allow if {
    input.user.role == "{{role_value}}"
}
"""

[[rule.tests]]
input = """
package main

func handle(user *User) {
    if user.Role == "admin" {
        deleteUser()
    }
}
"""
expect_match = true

[[rule.tests]]
input = """
package main

func handle(account *Account) {
    if account.AccountType == "enterprise" {
        enable()
    }
}
"""
expect_match = true

[[rule.tests]]
input = """
package main

func handle(user *User) {
    if user.Name == "admin" {
        greet()
    }
}
"""
expect_match = false

[[rule.tests]]
input = """
package main

func handle(user *User) {
    if user.Role != "guest" {
        run()
    }
}
"""
expect_match = false
