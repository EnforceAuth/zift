[rule]
id = "go-permission-check-call"
languages = ["go"]
category = "rbac"
confidence = "medium"
description = "Permission/authorization function call (e.g. HasPermission(\"orders:read\"), Authorize(\"admin\"))"
# Same shape as has-role-call but for permission/authorization-style names.
# Kept separate so the rego template emits a `permissions` check rather
# than a `role` check — these usually mean different policy shapes.
#
# Confidence is `medium` rather than `high` because the regex includes
# generic English verbs (`Can`, `Authorize`) that can name non-authz APIs
# (e.g. `q.Can("read")` on a queue capability check). Specific names
# like `HasPermission`/`RequirePermission` are stronger signals; the mix
# averages to `medium`.
#
# The argument is constrained to a string literal (interpreted or raw —
# Go supports both `"foo"` and `\`foo\``). Identifier or qualified-name
# args (e.g. `Authorize(perms.Admin)`) intentionally don't match: the
# rego template substitutes `{{perm_value}}` with the captured text, so
# non-literal args would emit nonsense stubs. This mirrors the Python
# rule's literal-only stance.
query = """
(call_expression
  function: [
    (identifier) @fn_name
    (selector_expression field: (field_identifier) @fn_name)
  ]
  arguments: (argument_list
    [
      (interpreted_string_literal (interpreted_string_literal_content) @perm_value)
      (raw_string_literal (raw_string_literal_content) @perm_value)
    ])
) @match
"""

[rule.predicates.fn_name]
match = "^(HasPermission|CheckPermission|IsAuthorized|Authorize|Can|RequirePermission)$"

[rule.rego_template]
template = """
default allow := false

allow if {
    "{{perm_value}}" in input.user.permissions
}
"""

[[rule.tests]]
input = """
package main

func handle() {
    if HasPermission("orders:read") {
        listOrders()
    }
}
"""
expect_match = true

[[rule.tests]]
input = """
package main

func handle(p *Policy) {
    if p.IsAuthorized("admin") {
        deleteAll()
    }
}
"""
expect_match = true

[[rule.tests]]
input = """
package main

func handle(u *User) {
    if u.Can("edit") {
        edit()
    }
}
"""
expect_match = true

# Raw string literals (backticks) are valid Go; the query accepts both
# interpreted and raw forms.
[[rule.tests]]
input = """
package main

func handle() {
    if HasPermission(`orders:read`) {
        listOrders()
    }
}
"""
expect_match = true

[[rule.tests]]
input = """
package main

func handle() {
    if HasRole("admin") {
        run()
    }
}
"""
expect_match = false
