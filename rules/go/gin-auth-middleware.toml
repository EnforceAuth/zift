[rule]
id = "go-gin-auth-middleware"
languages = ["go"]
category = "middleware"
confidence = "medium"
description = "Gin/Echo-style auth middleware registration (e.g. r.Use(AuthRequired()) or r.Use(AuthRequired))"
# Matches `<router>.Use(<middleware>)` where the argument is either:
#   - a call expression like `AuthRequired()` / `m.RequireAuth()` (factory form), or
#   - a bare function value like `AuthRequired` / `m.RequireAuth` (no parens).
# Covers Gin, Echo, Chi, and similar router APIs that share the
# `.Use(handler)` middleware shape. Both `gin.HandlerFunc` and
# `echo.MiddlewareFunc` are first-class values, so middleware is often
# passed as a value rather than a factory.
# Confidence stays `medium` — the auth-flavored fn-name regex
# (`AuthRequired`, `JWTAuth`, `RequireAuth`, …) is specific enough that
# accepting bare identifiers does not meaningfully widen FP risk.
query = """
(call_expression
  function: (selector_expression
    field: (field_identifier) @use_method)
  arguments: (argument_list
    [
      (call_expression
        function: [
          (identifier) @middleware_fn
          (selector_expression field: (field_identifier) @middleware_fn)
        ])
      (identifier) @middleware_fn
      (selector_expression field: (field_identifier) @middleware_fn)
    ])
) @match
"""

[rule.predicates.use_method]
eq = "Use"

[rule.predicates.middleware_fn]
match = "^(Auth|Authn|Authz|AuthRequired|AuthMiddleware|RequireAuth|RequireLogin|RequireRole|JWTAuth|JWT|BasicAuth|OAuth|RequireAdmin|RequirePermission)$"

[rule.rego_template]
template = """
# Middleware-style auth gate — every request hitting this router
# subtree must satisfy the policy. Adapt to your concrete subject /
# action / resource model.
default allow := false

allow if {
    input.user.authenticated == true
}
"""


[rule.cedar_template]
template = """
permit (
    principal,
    action,
    resource
)
when {
    context.authenticated == true
};
"""
[[rule.tests]]
input = """
package main

func setup(r *gin.Engine) {
    r.Use(AuthRequired())
}
"""
expect_match = true

[[rule.tests]]
input = """
package main

func setup(r *gin.Engine, m *Middleware) {
    r.Use(m.RequireAuth())
}
"""
expect_match = true

[[rule.tests]]
input = """
package main

func setup(r *gin.Engine) {
    r.Use(JWTAuth())
}
"""
expect_match = true

[[rule.tests]]
input = """
package main

func setup(r *gin.Engine) {
    r.Use(Logger())
}
"""
expect_match = false

[[rule.tests]]
input = """
package main

func setup(r *gin.Engine) {
    r.GET("/users", listUsers)
}
"""
expect_match = false

# Bare function-value middleware (no parens) — the gin.HandlerFunc /
# echo.MiddlewareFunc value form.
[[rule.tests]]
input = """
package main

func setup(r *gin.Engine) {
    r.Use(AuthRequired)
}
"""
expect_match = true

[[rule.tests]]
input = """
package main

func setup(r *gin.Engine, m *Middleware) {
    r.Use(m.RequireAuth)
}
"""
expect_match = true

[[rule.tests]]
input = """
package main

func setup(r *gin.Engine) {
    r.Use(Logger)
}
"""
expect_match = false
