[rule]
id = "java-spring-secured"
languages = ["java"]
category = "rbac"
confidence = "high"
description = "Spring Security @Secured annotation"
query = """
(annotation
  name: [
    (identifier) @anno_name
    (scoped_identifier
      scope: (_) @anno_scope
      name: (identifier) @anno_name)
  ]
  arguments: (annotation_argument_list
    (string_literal
      (string_fragment) @role_value))
) @match
"""

provenance_capture = "anno_scope"

[rule.predicates.anno_name]
eq = "Secured"

[rule.rego_template]
template = """
default allow := false

allow if {
    input.user.role in {"{{role_value}}"}
}
"""


[rule.cedar_template]
template = """
permit (
    principal,
    action,
    resource
)
when {
    principal.role == "{{role_value}}"
};
"""
[[rule.tests]]
input = """
public class UserController {
    @Secured("ROLE_ADMIN")
    public void deleteUser(Long id) { }
}
"""
expect_match = true

[[rule.tests]]
input = """
public class UserController {
    @org.springframework.security.access.annotation.Secured("ROLE_ADMIN")
    public void deleteUser(Long id) { }
}
"""
expect_match = true

[[rule.tests]]
input = """
public class UserController {
    @Override
    public void deleteUser(Long id) { }
}
"""
expect_match = false
