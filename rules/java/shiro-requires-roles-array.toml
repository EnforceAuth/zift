[rule]
id = "java-shiro-requires-roles-array"
languages = ["java"]
category = "rbac"
confidence = "high"
description = "Apache Shiro @RequiresRoles annotation with array of roles"
query = """
(annotation
  name: [
    (identifier) @anno_name
    (scoped_identifier
      scope: (_) @anno_scope
      name: (identifier) @anno_name)
  ]
  arguments: (annotation_argument_list
    (element_value_array_initializer
      (string_literal) @role_value))
) @match
"""

provenance_capture = "anno_scope"

[rule.predicates.anno_name]
eq = "RequiresRoles"

[rule.rego_template]
template = """
default allow := false

allow if {
    input.user.role in {{{role_value}}}
}
"""


[rule.cedar_template]
template = """
permit (
    principal,
    action,
    resource
)
when {
    principal.role in [{{cedar_roles_set}}]
};
"""
[[rule.tests]]
input = """
public class AdminController {
    @RequiresRoles({"admin", "manager"})
    public void adminAction() { }
}
"""
expect_match = true

[[rule.tests]]
input = """
public class AdminController {
    @org.apache.shiro.authz.annotation.RequiresRoles({"admin", "manager"})
    public void adminAction() { }
}
"""
expect_match = true

[[rule.tests]]
input = """
public class AdminController {
    @Transactional
    public void adminAction() { }
}
"""
expect_match = false
