[rule]
id = "java-is-user-in-role"
languages = ["java"]
category = "rbac"
confidence = "high"
description = "Servlet API isUserInRole() call"
# Accept string literals as well as field accesses and bare identifiers
# as the role argument; non-literal stubs need manual rego review.
query = """
(method_invocation
  name: (identifier) @method_name
  arguments: (argument_list
    [
      (string_literal (string_fragment) @role_value)
      (field_access) @role_value
      (identifier) @role_value
    ])
) @match
"""

[rule.predicates.method_name]
eq = "isUserInRole"

[rule.rego_template]
template = """
default allow := false

allow if {
    input.user.role in {"{{role_value}}"}
}
"""


[rule.cedar_template]
template = """
permit (
    principal,
    action,
    resource
)
when {
    principal.role == "{{role_value}}"
};
"""
[[rule.tests]]
input = """
public class MyServlet {
    public void doGet() {
        if (request.isUserInRole("admin")) { doSomething(); }
    }
}
"""
expect_match = true

[[rule.tests]]
input = """
public class MyServlet {
    public void doGet() {
        if (request.isUserInRole(Role.ADMIN)) { doSomething(); }
    }
}
"""
expect_match = true

[[rule.tests]]
input = """
public class MyServlet {
    public void doGet(String roleVar) {
        if (request.isUserInRole(roleVar)) { doSomething(); }
    }
}
"""
expect_match = true

[[rule.tests]]
input = """
public class MyServlet {
    public void doGet() {
        if (request.isAuthenticated()) { doSomething(); }
    }
}
"""
expect_match = false
