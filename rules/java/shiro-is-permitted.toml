[rule]
id = "java-shiro-is-permitted"
languages = ["java"]
category = "rbac"
confidence = "high"
description = "Apache Shiro Subject.isPermitted() call"
# Accept string literals as well as field accesses and bare identifiers
# as the permission argument; non-literal stubs need manual rego review.
query = """
(method_invocation
  name: (identifier) @method_name
  arguments: (argument_list
    [
      (string_literal (string_fragment) @perm_value)
      (field_access) @perm_value
      (identifier) @perm_value
    ])
) @match
"""

[rule.predicates.method_name]
match = "^(isPermitted|isPermittedAll|checkPermission|checkPermissions)$"

[rule.rego_template]
template = """
default allow := false

allow if {
    "{{perm_value}}" in input.user.permissions
}
"""

[[rule.tests]]
input = """
public class Service {
    public void delete() {
        if (subject.isPermitted("user:delete")) { doIt(); }
    }
}
"""
expect_match = true

[[rule.tests]]
input = """
public class Service {
    public void delete() {
        subject.checkPermission("user:delete");
    }
}
"""
expect_match = true

[[rule.tests]]
input = """
public class Service {
    public void delete() {
        if (subject.isPermitted(Permissions.USER_DELETE)) { doIt(); }
    }
}
"""
expect_match = true

[[rule.tests]]
input = """
public class Service {
    public void delete() {
        subject.doAction("user:delete");
    }
}
"""
expect_match = false
