[rule]
id = "java-shiro-requires-roles"
languages = ["java"]
category = "rbac"
confidence = "high"
description = "Apache Shiro @RequiresRoles annotation"
query = """
(annotation
  name: [
    (identifier) @anno_name
    (scoped_identifier
      scope: (_) @anno_scope
      name: (identifier) @anno_name)
  ]
  arguments: (annotation_argument_list
    (string_literal
      (string_fragment) @role_value))
) @match
"""

provenance_capture = "anno_scope"

[rule.predicates.anno_name]
eq = "RequiresRoles"

[rule.rego_template]
template = """
default allow := false

allow if {
    input.user.role in {"{{role_value}}"}
}
"""


[rule.cedar_template]
template = """
permit (
    principal,
    action,
    resource
)
when {
    principal.role == "{{role_value}}"
};
"""
[[rule.tests]]
input = """
public class AdminController {
    @RequiresRoles("admin")
    public void adminAction() { }
}
"""
expect_match = true

[[rule.tests]]
input = """
public class AdminController {
    @org.apache.shiro.authz.annotation.RequiresRoles("admin")
    public void adminAction() { }
}
"""
expect_match = true

[[rule.tests]]
input = """
public class AdminController {
    @Transactional
    public void adminAction() { }
}
"""
expect_match = false
