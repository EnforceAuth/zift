[rule]
id = "java-has-role-call"
languages = ["java"]
category = "rbac"
confidence = "high"
description = "Spring Security hasRole/hasAuthority method call"
# Accept string literals as well as field accesses (e.g. `Role.ADMIN`) and
# bare identifiers (e.g. `role`) as the role argument. The rego stub treats
# whatever text is captured as the role name; for non-literal expressions
# the stub will need manual review, but the finding is still recorded.
query = """
(method_invocation
  name: (identifier) @method_name
  arguments: (argument_list
    [
      (string_literal (string_fragment) @role_value)
      (field_access) @role_value
      (identifier) @role_value
    ])
) @match
"""

[rule.predicates.method_name]
match = "^(hasRole|hasAnyRole|hasAuthority|hasAnyAuthority)$"

[rule.rego_template]
template = """
default allow := false

# granted_authority covers both roles (e.g. "ROLE_ADMIN") and
# authorities/permissions (e.g. "SCOPE_read") per Spring Security's
# GrantedAuthority abstraction.
allow if {
    input.user.granted_authority in {"{{role_value}}"}
}
"""

[[rule.tests]]
input = """
public class SecurityConfig {
    public void configure() {
        http.authorizeRequests().antMatchers("/admin/**").hasRole("ADMIN");
    }
}
"""
expect_match = true

[[rule.tests]]
input = """
public class SecurityConfig {
    public void configure() {
        http.authorizeRequests().antMatchers("/ops/**").hasAnyRole("ADMIN", "OPS");
    }
}
"""
expect_match = true

[[rule.tests]]
input = """
public class SecurityConfig {
    public void configure() {
        http.authorizeRequests().antMatchers("/api/**").hasAnyAuthority("SCOPE_read", "SCOPE_write");
    }
}
"""
expect_match = true

[[rule.tests]]
input = """
public class SecurityConfig {
    public void configure() {
        http.authorizeRequests().antMatchers("/reports/**").hasAuthority("SCOPE_reports.read");
    }
}
"""
expect_match = true

[[rule.tests]]
input = """
public class Service {
    public void check(Account acct) {
        if (!acct.hasRole(Role.ADMIN)) { throw new ForbiddenException(); }
    }
}
"""
expect_match = true

[[rule.tests]]
input = """
public class Service {
    public void check(Account acct, String role) {
        if (acct.hasRole(role)) { allow(); }
    }
}
"""
expect_match = true

[[rule.tests]]
input = """
public class SecurityConfig {
    public void configure() {
        http.authorizeRequests().antMatchers("/public/**").permitAll();
    }
}
"""
expect_match = false
