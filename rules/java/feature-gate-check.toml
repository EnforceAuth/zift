[rule]
id = "java-feature-gate-check"
languages = ["java"]
category = "feature_gate"
confidence = "medium"
description = "Feature flag or plan-based gating in Java"
# Accept string literals as well as field accesses and bare identifiers
# as the feature key; non-literal stubs need manual rego review.
query = """
(method_invocation
  name: (identifier) @method_name
  arguments: (argument_list
    [
      (string_literal (string_fragment) @feature)
      (field_access) @feature
      (identifier) @feature
    ])
) @match
"""

[rule.predicates.method_name]
match = "^(hasFeature|isFeatureEnabled|checkFeature|hasPlan|isPlanActive)$"

[[rule.tests]]
input = """
public class Service {
    public void check() {
        if (featureFlags.hasFeature("advanced-analytics")) { enable(); }
    }
}
"""
expect_match = true

[[rule.tests]]
input = """
public class Service {
    public void check() {
        if (featureFlags.isFeatureEnabled("beta-dashboard")) { enable(); }
    }
}
"""
expect_match = true

[[rule.tests]]
input = """
public class Service {
    public void check() {
        if (subscription.hasPlan("pro")) { enable(); }
    }
}
"""
expect_match = true

[[rule.tests]]
input = """
public class Service {
    public void check(String featureKey) {
        if (featureFlags.hasFeature(featureKey)) { enable(); }
    }
}
"""
expect_match = true

[[rule.tests]]
input = """
public class Service {
    public void check() {
        if (featureFlags.isFeatureEnabled(Features.BETA_DASHBOARD)) { enable(); }
    }
}
"""
expect_match = true

[[rule.tests]]
input = """
public class Service {
    public void check() {
        if (validator.isEnabled("field")) { validate(); }
    }
}
"""
expect_match = false
