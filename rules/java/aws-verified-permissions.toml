[rule]
id = "java-aws-verified-permissions"
languages = ["java"]
category = "custom"
confidence = "high"
description = "AWS Verified Permissions authorization call in Java"
externalized = true
query = """
(method_invocation
  object: (_) @receiver
  name: (identifier) @method_name
) @match
"""

[rule.predicates.method_name]
match = "^(isAuthorized|isAuthorizedWithToken)$"

[rule.predicates.receiver]
match = "(?i)(verifiedpermissions|verified_permissions|avp|vp|client)"

[[rule.tests]]
input = """
import software.amazon.awssdk.services.verifiedpermissions.VerifiedPermissionsClient;

class Handler {
    void decide(VerifiedPermissionsClient client, IsAuthorizedRequest request) {
        client.isAuthorized(request);
    }
}
"""
expect_match = true

[[rule.tests]]
input = """
class Handler {
    void decide(VerifiedPermissionsClient client, IsAuthorizedWithTokenRequest request) {
        client.isAuthorizedWithToken(request);
    }
}
"""
expect_match = true

[[rule.tests]]
input = """
class Handler {
    void run(Service svc) {
        svc.process(input);
    }
}
"""
expect_match = false
