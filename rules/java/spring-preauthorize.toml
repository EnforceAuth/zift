[rule]
id = "java-spring-preauthorize"
languages = ["java"]
category = "rbac"
confidence = "high"
description = "Spring Security @PreAuthorize annotation"
query = """
(annotation
  name: [
    (identifier) @anno_name
    (scoped_identifier
      scope: (_) @anno_scope
      name: (identifier) @anno_name)
  ]
  arguments: (annotation_argument_list
    (string_literal
      (string_fragment) @expr))
) @match
"""

provenance_capture = "anno_scope"

[rule.predicates.anno_name]
eq = "PreAuthorize"

[rule.rego_template]
template = """
default allow := false

allow if {
    # TODO: translate SpEL expression: {{expr}}
    input.user.role in {"TODO"}
}
"""


[rule.cedar_template]
template = """
permit (
    principal,
    action,
    resource
)
when {
    principal.role == "TODO"
};
"""
[[rule.tests]]
input = """
public class AdminController {
    @PreAuthorize("hasRole('ADMIN')")
    public void deleteUser(Long id) { }
}
"""
expect_match = true

[[rule.tests]]
input = """
public class AdminController {
    @PreAuthorize("hasAuthority('SCOPE_read')")
    public void readData() { }
}
"""
expect_match = true

[[rule.tests]]
input = """
public class AdminController {
    @org.springframework.security.access.prepost.PreAuthorize("hasRole('ADMIN')")
    public void deleteUser(Long id) { }
}
"""
expect_match = true

[[rule.tests]]
input = """
public class AdminController {
    @Override
    public void deleteUser(Long id) { }
}
"""
expect_match = false
