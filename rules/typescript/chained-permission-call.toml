[rule]
id = "ts-chained-permission-call"
languages = ["typescript", "javascript"]
category = "abac"
confidence = "medium"
description = "Chained permission DSL (e.g. canThis(user).edit.post(post), CASL/Pundit-style ability checks)"
# Matches the shape `<callee>(...).<verb>.<resource>(...)` where the
# leftmost callee is a permission entry point. Surfaced by the Ghost
# permission DSL (`canThis(user).edit.post(post)`) and by CASL/Pundit
# ports that follow the same pattern.
#
# Predicate on the callee is a prefix match so common variants like
# `canThis`, `mayDo`, `allowFor`, `checkAbility` all qualify.
# Confidence is medium because the shape is distinctive but the callee
# predicate (`can`/`may`/`allow`/`check`/`ability`) is generic English.
query = """
(call_expression
  function: (member_expression
    object: (member_expression
      object: (call_expression
        function: (identifier) @callee)
      property: (property_identifier) @verb)
    property: (property_identifier) @resource)
) @match
"""

[rule.predicates.callee]
match = "(?i)^(can|may|allow|check|ability)([A-Z]\\w*)?$"

# Stub Rego template. The verb/resource pair is captured as identifiers
# (not string literals), so {{verb}} and {{resource}} substitute in the
# *names* (e.g. "edit", "post") rather than runtime values. Imprecise
# by design — generated policies are meant for manual review. Sister
# rules without literal-arg captures (e.g. java-spring-preauthorize)
# follow the same TODO-stub convention.
[rule.rego_template]
template = """
default allow := false

# TODO: chained DSL — captured verb/resource are identifiers, not
# runtime values. Replace input.action/input.resource with the actual
# inputs your policy receives.
allow if {
    input.action == "{{verb}}"
    input.resource == "{{resource}}"
}
"""


[rule.cedar_template]
template = """
permit (
    principal,
    action,
    resource
)
when {
    // TODO: chained DSL — captured verb/resource are identifiers, not
    // runtime values. Map onto your Cedar action/resource entities.
    action == Action::"{{verb}}"
};
"""
# -- Positive: Ghost-style permission DSL --

[[rule.tests]]
input = """
if (canThis(user).edit.post(post)) {
  editPost();
}
"""
expect_match = true

[[rule.tests]]
input = """
if (canThis(req.user).browse.users()) {
  listUsers();
}
"""
expect_match = true

# CASL-style: `can(user).read.Article(article)` — the actual CASL DSL is
# slightly different (`ability.can('read', Article)`), but ports/wrappers
# often expose this chained shape.
[[rule.tests]]
input = """
if (ability(user).read.article(article)) {
  showArticle();
}
"""
expect_match = true

# -- Negative: not a chained permission DSL --

[[rule.tests]]
input = """
if (api.get.user(id)) {
  load();
}
"""
expect_match = false

# Wrong shape: only one property between the call and the final invocation.
[[rule.tests]]
input = """
if (canThis(user).post(post)) {
  edit();
}
"""
expect_match = false
