[rule]
id = "csharp-aspnet-endpoint-allow-anonymous"
languages = ["csharp"]
category = "middleware"
confidence = "high"
description = "ASP.NET Core endpoint AllowAnonymous() call"
query = """
(invocation_expression
  function: (member_access_expression
    name: (identifier) @method_name)
  arguments: (argument_list)
) @match
"""

[rule.predicates.method_name]
eq = "AllowAnonymous"

[[rule.tests]]
input = """
var app = builder.Build();
app.MapGet("/health", () => "ok").AllowAnonymous();
"""
expect_match = true

[[rule.tests]]
input = """
var app = builder.Build();
app.MapGet("/admin", () => "ok").RequireAuthorization();
"""
expect_match = false
