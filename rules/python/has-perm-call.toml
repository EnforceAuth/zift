[rule]
id = "py-has-perm-call"
languages = ["python"]
category = "rbac"
confidence = "high"
description = "Django-style permission check (request.user.has_perm / has_perms)"
# Matches `<expr>.has_perm("app.codename")` and the bulk variant
# `<expr>.has_perms(["app.a", "app.b"])`. Only the literal-string form is
# captured today; dynamic permission codes will surface via deep mode.
query = """
(call
  function: (attribute
    attribute: (identifier) @method)
  arguments: (argument_list
    (string (string_content) @perm_name))
) @match
"""

[rule.predicates.method]
match = "^(has_perm|has_perms)$"

[rule.rego_template]
template = """
default allow := false

allow if {
    "{{perm_name}}" in input.user.permissions
}
"""

[[rule.tests]]
input = """
if request.user.has_perm('app.delete_user'):
    delete_user()
"""
expect_match = true

[[rule.tests]]
input = """
if user.has_perm('blog.add_post'):
    create()
"""
expect_match = true

[[rule.tests]]
input = """
result.has_value('foo')
"""
expect_match = false
