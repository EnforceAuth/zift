[rule]
id = "py-feature-gate-check"
languages = ["python"]
category = "feature_gate"
confidence = "medium"
description = "Feature flag or plan-based gating in Python"
# Mirrors the Java/TS feature-gate rules. Only the literal-string form is
# captured; dynamic feature keys (Features.BETA_DASHBOARD or a variable)
# can be added later if false negatives surface.
query = """
(call
  function: (attribute
    attribute: (identifier) @method)
  arguments: (argument_list
    (string (string_content) @feature))
) @match
"""

[rule.predicates.method]
match = "^(has_feature|is_feature_enabled|check_feature|has_plan|is_plan_active)$"

[[rule.tests]]
input = """
if feature_flags.has_feature("advanced-analytics"):
    enable()
"""
expect_match = true

[[rule.tests]]
input = """
if subscription.has_plan("pro"):
    enable()
"""
expect_match = true

[[rule.tests]]
input = """
if validator.is_enabled("field"):
    validate()
"""
expect_match = false
